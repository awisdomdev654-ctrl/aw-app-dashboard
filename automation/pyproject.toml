[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatekeeper-automation"
version = "1.0.0"
description = "Python automation for Gatekeeper Audio — transcoding and security remediation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31.0"]

[project.scripts]
gatekeeper = "gatekeeper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gatekeeper*"]
